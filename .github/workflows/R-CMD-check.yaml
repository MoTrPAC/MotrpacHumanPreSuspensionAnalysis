name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: R-CMD-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # inspectdf, imported by MotrpacBicQC, is archived on CRAN, so the
      # dependency resolver below cannot find it in the source index.
      # Install it from the CRAN archive first.
      - name: Install inspectdf from the CRAN archive
        shell: Rscript {0}
        run: |
          install.packages("remotes")
          remotes::install_version("inspectdf", version = "0.0.12.1", repos = "https://cloud.r-project.org", upgrade = "never")

      # Resolves Imports, Suggests and the Remotes entry for MotrpacBicQC,
      # including the Bioconductor packages (ComplexHeatmap, TMSig,
      # variancePartition) for the R release in use.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          upload-snapshots: true
