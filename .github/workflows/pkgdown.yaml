name: pkgdown

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pkgdown
  cancel-in-progress: false

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("BiocManager", "remotes", "pkgdown"), repos = "https://cloud.r-project.org")
          options(repos = BiocManager::repositories())
          BiocManager::install(c("ComplexHeatmap", "Biobase", "Mfuzz", "TMSig", "variancePartition"), ask = FALSE, update = FALSE)
          remotes::install_github("MoTrPAC/MotrpacBicQC", upgrade = "never")
          remotes::install_deps(dependencies = TRUE, upgrade = "never")

      - name: Configure git author
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install package
        shell: Rscript {0}
        run: |
          remotes::install_local(".", upgrade = "never", force = TRUE)

      - name: Deploy pkgdown site
        run: pkgdown::deploy_to_branch(new_process = FALSE, install = FALSE)
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        shell: Rscript {0}
